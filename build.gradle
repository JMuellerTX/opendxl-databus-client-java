// OWASP dependency-check needs Java 11+ and an NVD API key (https://nvd.nist.gov/developers/request-an-api-key).
// The plugin is only put on the build classpath (and applied further below) when the key is provided, so the
// build itself keeps working on a Java 8 JVM: ./gradlew dependencyCheckAnalyze -PnvdApiKey=<key>
buildscript {
    if (project.hasProperty('nvdApiKey')) {
        repositories {
            mavenCentral()
        }
        dependencies {
            classpath 'org.owasp:dependency-check-gradle:12.2.2'
        }
    }
}

plugins {
    id 'checkstyle'
    id 'distribution'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id "com.gradleup.shadow" version "8.3.11"
    id "kr.motd.sphinx" version "2.10.1"
    id "jacoco"
}

group 'com.opendxl'

// JDK pin of this branch (see "Branches" in README.md): the toolchain compiles, tests and generates the javadoc
// with exactly this JDK, whatever JDK runs Gradle itself. A missing JDK is downloaded through the foojay
// resolver declared in settings.gradle. Keep this the only place where the branch's JDK is set.
// jdk11 line: javac --release 11; nothing JDK specific is needed (Kafka 3.9.x, ZooKeeper 3.9 and jacoco 0.8.15
// run on 11 without extra JVM flags). This is the oldest line that could move to Kafka 4.x.
def javaVersion = 11
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}
if (javaVersion > 8) {
    // javac --release: bytecode and the visible JDK API are limited to this version
    tasks.withType(JavaCompile).configureEach {
        options.release = javaVersion
    }
} else {
    // javac 8 has no --release option; source/target keep the bytecode and the language level at Java 8
    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

apply plugin: 'base'
apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'maven-publish'
apply plugin: 'signing'

// OWASP dependency-check, see the buildscript block at the top
if (project.hasProperty('nvdApiKey')) {
    apply plugin: 'org.owasp.dependencycheck'
    dependencyCheck {
        nvd {
            apiKey = project.property('nvdApiKey')
        }
        suppressionFile = "${projectDir}/config/dependency-check/owasp-suppression.xml"
    }
    check.dependsOn dependencyCheckAnalyze
}

jacoco {
    toolVersion = "0.8.15"
    reportsDirectory = layout.buildDirectory.dir("reports/coverage")
}

jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir("reports/coverage")
    }
}

// The main resources overlap with the Java sources; keep the pre-Gradle 7 behaviour for the copied duplicates
tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

configurations {
    kafkaInMemory
    sampleJars.extendsFrom testImplementation
}

configurations.all {
    resolutionStrategy {
        force 'com.fasterxml.jackson.core:jackson-annotations:2.22'
        force 'com.fasterxml.jackson.core:jackson-core:2.22.2'
        force 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
        // https://nvd.nist.gov/vuln/detail/CVE-2019-12402 (and later commons-compress fixes)
        force 'org.apache.commons:commons-compress:1.28.0'
        // Align every netty module pulled in by ZooKeeper/Kafka on a fixed version
        eachDependency { details ->
            if (details.requested.group == 'io.netty' && details.requested.name.startsWith('netty-') && !details.requested.name.startsWith('netty-tcnative')) {
                details.useVersion '4.1.137.Final'
            }
        }
    }
}

dependencies {
    implementation ('org.apache.kafka:kafka-clients:3.9.2') {
        exclude group: 'org.scala-lang', module: 'scala-reflect'
        exclude group: 'org.lz4', module: 'lz4-java'
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
    }
    implementation ('org.apache.kafka:kafka-streams:3.9.2') {
        exclude group: 'org.scala-lang', module: 'scala-reflect'
    }
    implementation group: 'org.xerial.snappy', name: 'snappy-java', version: '1.1.10.8'
    implementation 'org.scala-lang:scala-reflect:2.12.20'
    implementation 'at.yawk.lz4:lz4-java:1.11.1'
    implementation 'org.apache.avro:avro:1.11.5'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    testImplementation('org.apache.kafka:kafka_2.12:3.9.2') {
        exclude group: 'org.scala-lang', module: 'scala-reflect'
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
    }
    testImplementation 'org.scala-lang:scala-reflect:2.12.20'
    testImplementation 'org.apache.zookeeper:zookeeper:3.9.5'
    // Required by the ZooKeeper server metrics since ZooKeeper 3.6
    testImplementation 'io.dropwizard.metrics:metrics-core:4.2.40'
    testImplementation 'commons-io:commons-io:2.22.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.e-movimento.tinytools:privilegedaccessor:1.2.2'

    kafkaInMemory ('org.apache.kafka:kafka_2.12:3.9.2') {
        exclude group: 'org.scala-lang', module: 'scala-reflect'
        exclude group: 'org.lz4', module: 'lz4-java'
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
    }
    kafkaInMemory 'org.scala-lang:scala-reflect:2.12.20'
    kafkaInMemory 'at.yawk.lz4:lz4-java:1.11.1'
    kafkaInMemory 'commons-io:commons-io:2.22.0'
    kafkaInMemory 'org.apache.zookeeper:zookeeper:3.9.5'
    kafkaInMemory 'io.dropwizard.metrics:metrics-core:4.2.40'

    // This following section mitigates OWASP vulnerabilities report.
    // It enforces to use specific transitive dependency versions
    // when their previous versions were mentioned by OWASP vulnerability reports.
    // If a vulnerability is false-positive,
    // libraries should be declared in /config/dependency-check/owasp-supression.xml

    // https://nvd.nist.gov/vuln/detail/CVE-2019-12384
    // https://nvd.nist.gov/vuln/detail/CVE-2019-12814
    // https://nvd.nist.gov/vuln/detail/CVE-2019-14379
    // https://nvd.nist.gov/vuln/detail/CVE-2019-14439
    // http://web.nvd.nist.gov/view/vuln/detail?vulnId=CVE-2019-14540
    // http://web.nvd.nist.gov/view/vuln/detail?vulnId=CVE-2019-16335
    // http://web.nvd.nist.gov/view/vuln/detail?vulnId=CVE-2019-16942
    // http://web.nvd.nist.gov/view/vuln/detail?vulnId=CVE-2019-16943
    // CVE-2020-25649
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    kafkaInMemory 'com.fasterxml.jackson.core:jackson-databind:2.22.2'

    // http://web.nvd.nist.gov/view/vuln/detail?vulnId=CVE-2019-12402
    kafkaInMemory 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
}

repositories {
    mavenCentral()
}

// Jar Manifest info
jar {
    manifest {
        attributes('Main-Class': 'com.opendxl.databus.cli.CommandLineInterface',
                'Implementation-Title': rootProject.name,
                'Implementation-Version': rootProject.name
        )
    }
}

// Task for creating a jar with the source files
task sourceJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

// Task for creating a jar with JavaDoc
task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

javadoc {
    exclude "**/broker/**"
    options.memberLevel = JavadocMemberLevel.PUBLIC
}

artifacts {
    archives jar
    archives sourceJar
    archives javadocJar
}

// Set up the distribution zip
distributions {
    main {
        distributionBaseName = 'dxldatabusclient-java-sdk'
        contents {
            from(jar) {
                into('lib')
            }
            from(shadowJar) {
                into("lib")
            }
            from(configurations.sampleJars) {
                into("sample/lib")
            }
            from(configurations.compileClasspath) {
                into("lib/3rdparty")
            }
            from(sphinx) {
                into('doc')
            }
            from('sample') {
                into 'sample'
            }
            from('broker/src/broker') {
                into 'sample/src/broker'
            }
            from(shadowJar) {
                into("sample/lib")
            }
            from(configurations.kafkaInMemory) {
                into("sample/lib/kafka")
            }
            from('distribution')
        }
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/java'
        }
        compileClasspath +=   configurations.kafkaInMemory
        runtimeClasspath +=  configurations.kafkaInMemory
    }
    sample {
        java {
            srcDir 'sample/src'
            srcDir 'broker/src'
        }
        resources {
            srcDir 'sample/src'
        }
        compileClasspath += main.output + test.output + configurations.compileClasspath + configurations.kafkaInMemory
        runtimeClasspath += main.output + test.output + configurations.runtimeClasspath + configurations.kafkaInMemory
    }
    test {
        java {
            srcDir 'src/test/java'
            srcDir 'broker/src'
        }
        resources {
            srcDir 'src/test/resources'
        }
    }
}

// The tests start an embedded Kafka broker and ZooKeeper; the default 512m worker heap is not enough for Kafka 3.x
test {
    maxHeapSize = '2g'
}

// Make check style run before creating a jar
jar.dependsOn(checkstyleMain)

// The samples ship as sources in the distribution; compile them as part of the build so API removals in
// dependency updates are caught by CI
check.dependsOn(sampleClasses)

// Force distZip to be dependent on javadocJar and sourceJar
distZip.dependsOn javadocJar
distZip.dependsOn sourceJar

sphinx {
    // Change the source directory.
    sourceDirectory = "${projectDir}/docs"
    // Change the output directory.
    outputDirectory = "${project.buildDir}/docs"
}

task versionFile()  {
    doLast {
        new File("${projectDir}/VERSION").text = """$version"""
    }
}

checkstyle {
    sourceSets = []
    toolVersion '8.39'


}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = group
            pom {
                name = 'OpenDXL Databus Java Client'
                description = 'An OpenDXL Databus client library for Java'
                url = 'https://github.com/opendxl/opendxl-databus-client-java'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        email = 'support@opendxl.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/opendxl/opendxl-databus-client-java.git'
                    developerConnection = 'scm:git:ssh://github.com/opendxl/opendxl-databus-client-java.git'
                    url = 'https://github.com/opendxl/opendxl-databus-client-java'
                }
            }

            from components.java

            artifact(sourceJar) {
                classifier = 'sources'
            }
            artifact(javadocJar) {
                classifier = 'javadoc'
            }
        }
    }
    repositories {
        maven {
            url = "$buildDir/repo"
//            def releasesRepoUrl = "https://oss.sonatype.org/service/local/staging/deploy/maven2"
//            def snapshotsRepoUrl = "https://oss.sonatype.org/content/repositories/snapshots"
//            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
//            credentials {
//                username sonatypeUsername
//                password sonatypePassword
//            }

        }
    }
}

task replaceVersionInREADME() {
    if (!version.endsWith('SNAPSHOT')) {
        // Maven
        ant.replaceregexp(match: '<version>(.+)</version>', replace: "<version>${version}</version>", flags: 'g', byline: true) {
            fileset(dir: '.', includes: 'README.md')
        }
        ant.replaceregexp(match: '<version>(.+)</version>', replace: "<version>${version}</version>", flags: 'g', byline: true) {
            fileset(dir: 'docs', includes: 'index.rst')
        }
        // Gradle
        ant.replaceregexp(match: "com\\.opendxl\\:dxldatabusclient\\:(.+)", replace: "com.opendxl:dxldatabusclient:${version}'", flags: 'g', byline: true) {
            fileset(dir: '.', includes: 'README.md')
        }
        ant.replaceregexp(match: "com\\.opendxl\\:dxldatabusclient\\:(.+)", replace: "com.opendxl:dxldatabusclient:${version}'", flags: 'g', byline: true) {
            fileset(dir: 'docs', includes: 'index.rst')
        }
        // Command Line (Docs)
        ant.replaceregexp(match: "dxldatabusclient-(.*).jar", replace: "dxldatabusclient-${version}.jar", flags: 'g', byline: true) {
            fileset(dir: 'docs', includes: 'CLI-Example.rst')
        }
    }
}

signing {sign publishing.publications.maven}

// Declare the implicit task dependencies of the distribution (required since Gradle 7.1)
tasks.named('distTar') {
    it.mustRunAfter(tasks.named('javadoc'))
}

tasks.named('javadocJar') {
    it.mustRunAfter(tasks.named('sphinx'))
}

distZip.dependsOn javadocJar
distZip.dependsOn sourceJar
sphinx.dependsOn(versionFile)
assemble.dependsOn(replaceVersionInREADME)
