name: Build

# jdk17 line (see "Branches" in README.md): the same workflow as on master, reduced to JDK 17 and to this branch.
# Gradle runs on the matrix JDK and the toolchain in build.gradle uses the same version, so nothing is downloaded
# by the foojay resolver in CI. The schedule is only honoured by GitHub on the default branch (master).
on:
  workflow_dispatch:
  push:
    branches:
      - jdk17
  pull_request:
    branches:
      - jdk17
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 17 ]
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java-version }}

    - name: Execute CI
      run: |
        ./gradlew build
