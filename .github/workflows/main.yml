name: Build

# master is the JDK 21 line (see "Branches" in README.md); the jdk8/jdk11/jdk17 branches carry the same workflow
# reduced to their own JDK. Gradle runs on the matrix JDK and the toolchain in build.gradle uses the same version,
# so nothing is downloaded by the foojay resolver in CI.
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 21 ]
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java-version }}

    - name: Execute CI
      run: |
        ./gradlew build
